name: Apply Eiffel hero image

on:
  push:
    branches:
      - otatam-eiffel-hero-patch
    paths:
      - .github/workflows/otatam-eiffel-hero-patch.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Replace only hero city visual
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'public/index.html';
          let s = fs.readFileSync(p, 'utf8');

          const oldValue = 'background:linear-gradient(180deg,rgba(5,18,14,.02),rgba(5,18,14,.58)),linear-gradient(90deg,rgba(8,24,18,.28),transparent 52%),url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Vienna%20panorama.jpg?width=1600") center/cover no-repeat;';
          const newValue = 'background:linear-gradient(180deg,rgba(3,8,18,.10),rgba(3,8,18,.70)),linear-gradient(90deg,rgba(3,8,16,.32),transparent 55%),url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Eiffel%20Tower%20at%20night%20%28Unsplash%20Fy1UlOIKBII%29.jpg?width=1600") center 46%/cover no-repeat;';

          if (!s.includes(oldValue)) throw new Error('Current hero image target not found');
          s = s.replace(oldValue, newValue);
          fs.writeFileSync(p, s);
          NODE

      - name: Validate focused change
        shell: bash
        run: |
          git diff --check
          grep -q 'Eiffel%20Tower%20at%20night%20%28Unsplash%20Fy1UlOIKBII%29.jpg' public/index.html
          if grep -q 'Vienna%20panorama.jpg' public/index.html; then
            echo 'Old hero image still present' >&2
            exit 1
          fi

      - name: Commit to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Replace hero with cinematic Eiffel night image"
          git push origin HEAD:main
