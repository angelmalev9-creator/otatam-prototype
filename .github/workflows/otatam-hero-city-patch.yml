name: Apply OTATAM hero city image

on:
  push:
    branches:
      - otatam-hero-city-patch
    paths:
      - .github/workflows/otatam-hero-city-patch.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply focused hero visual patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'public/index.html';
          let s = fs.readFileSync(p, 'utf8');

          const desktopOld = `.routeArt{position:relative;min-height:520px}.globe{position:absolute;width:430px;height:430px;border-radius:50%;right:12px;top:40px;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.15),transparent 20%),radial-gradient(circle at 62% 55%,rgba(216,255,115,.16),transparent 17%),linear-gradient(145deg,#19372f,#0d1f1a);box-shadow:inset 0 0 80px rgba(255,255,255,.025),0 40px 100px rgba(0,0,0,.3);overflow:hidden;animation:globeFloat 8s ease-in-out infinite}.globe:before,.globe:after{content:"";position:absolute;inset:14% 0;border:1px solid rgba(255,255,255,.11);border-radius:50%}.globe:after{inset:0 29%;transform:rotate(90deg)}`;
          const desktopNew = `.routeArt{position:relative;min-height:520px}.globe{position:absolute;width:470px;height:440px;border-radius:36px;right:0;top:32px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(5,18,14,.02),rgba(5,18,14,.58)),linear-gradient(90deg,rgba(8,24,18,.28),transparent 52%),url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Vienna%20panorama.jpg?width=1600") center/cover no-repeat;box-shadow:inset 0 0 80px rgba(0,0,0,.08),0 40px 100px rgba(0,0,0,.34);overflow:hidden;animation:globeFloat 8s ease-in-out infinite}.globe:before,.globe:after{content:"";position:absolute;inset:10% -8%;border:1px solid rgba(255,255,255,.18);border-radius:50%;transform:rotate(-9deg)}.globe:after{inset:20% 8%;border-color:rgba(216,255,115,.18);transform:rotate(14deg)}`;

          const mobileOld = `.routeArt{display:block;position:absolute;inset:auto -100px 5svh auto;width:300px;height:300px;min-height:0;opacity:.45;pointer-events:none}.globe{display:block;width:250px;height:250px;right:10px;top:10px;box-shadow:0 24px 70px rgba(0,0,0,.34)}.floating{display:none}`;
          const mobileNew = `.routeArt{display:block;position:relative;inset:auto;width:100%;height:236px;min-height:236px;margin:28px 0 -12px;opacity:1;pointer-events:none;animation:fadeUp .85s .28s var(--ease) both}.globe{display:block;width:100%;height:224px;right:auto;left:0;top:0;border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.34);transform:none}.globe:before{inset:7% -24%;transform:rotate(-7deg)}.globe:after{inset:17% -4%;transform:rotate(11deg)}.routeLine{left:16%;right:13%;top:23%;height:52%}.floating{display:none}`;

          if (!s.includes(desktopOld)) throw new Error('Desktop hero target not found');
          if (!s.includes(mobileOld)) throw new Error('Mobile hero target not found');
          s = s.replace(desktopOld, desktopNew).replace(mobileOld, mobileNew);
          fs.writeFileSync(p, s);
          NODE

      - name: Commit hero change to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --check
          git commit -m "Add cinematic city travel image to hero"
          git push origin HEAD:main
